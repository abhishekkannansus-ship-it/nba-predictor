services:
  - type: web
    name: nba-predictor-api
    env: python
    plan: free
    # Set "Root Directory" to "backend" in the Render dashboard,
    # or move this file to the repo root and keep rootDir below.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /health
